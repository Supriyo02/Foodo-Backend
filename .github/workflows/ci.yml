name: CI — FastAPI simple

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      -main
      -dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests httpx

      - name: Set DATABASE_URL environment variable
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test_db" >> $GITHUB_ENV

      - name: Set PYTHONPATH
        run: | 
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run build/test check
        run: |
          if [ -d tests ]; then
              pytest -q --tb=short
          else
              echo "No tests folder, skipping."
          fi
